name: Build Windows Application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.x'
        cache: true

    - name: Install Fyne Toolkit
      run: |
        go install fyne.io/fyne/v2/cmd/fyne@latest

    - name: Get dependencies
      run: |
        go mod download

    - name: Build Application
      run: |
        # Ensure Fyne tool is in PATH
        $env:PATH += ";$HOME/go/bin"
        # Package the app. fyne package handles the icon and resource embedding for Windows.
        fyne package -os windows -icon icon.ico -name "EchoVR-Cosmetics-Editor"


    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: EchoVR-Cosmetics-Editor-Windows
        path: EchoVR-Cosmetics-Editor.exe
